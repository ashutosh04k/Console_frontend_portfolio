<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Dark Code Editor Identity -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="50%" stop-color="#10141d"/>
      <stop offset="100%" stop-color="#171c28"/>
    </linearGradient>

    <!-- Terminal Green Gradient for 'A' -->
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4af626"/>
      <stop offset="100%" stop-color="#2fa617"/>
    </linearGradient>

    <!-- Crossbar / Amber Accent Gradient -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#ff9d1e"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Hairline Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#232a3b" stroke-width="12"/>

  <!-- Live state green indicator ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#4af626" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Geometric 'A' Symbol -->
  <g filter="url(#glow)">
    <!-- Main A Body -->
    <path d="M 256 96 L 388 392 H 324 L 298 332 H 214 L 188 392 H 124 Z M 256 172 L 236 272 H 276 Z" fill="url(#green-grad)" fill-rule="evenodd"/>

    <!-- High tech Amber Crossbar Accent -->
    <rect x="204" y="290" width="104" height="26" rx="8" fill="url(#amber-grad)"/>

    <!-- Terminal white dot accent on top apex of 'A' -->
    <circle cx="256" cy="116" r="14" fill="#ffffff"/>
  </g>
</svg>
